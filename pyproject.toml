[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whiteboard-studio"
version = "2.0.0"
description = "Vidéos « main qui dessine » (whiteboard animation) pour YouTube"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Denis Favre" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "opencv-python-headless>=4.8", "Pillow>=10.0", "imageio-ffmpeg>=0.4.9",
                "svgelements>=1.9"]

[project.scripts]
whiteboard-studio = "whiteboard.cli:main"

[tool.setuptools]
packages = ["whiteboard"]

[tool.setuptools.package-data]
whiteboard = ["assets/*", "assets/polices/*", "assets/icones/*", "assets/cliparts/*", "assets/personnages/*"]
